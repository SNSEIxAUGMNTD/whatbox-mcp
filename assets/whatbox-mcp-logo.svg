<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Whatbox MCP logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f3b3a"/>
      <stop offset="1" stop-color="#0a2529"/>
    </linearGradient>
    <linearGradient id="teal" x1="30" y1="40" x2="130" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ec7a8"/>
      <stop offset="1" stop-color="#149e82"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="34" fill="url(#bg)"/>
  <rect x="4.75" y="4.75" width="150.5" height="150.5" rx="33.25" fill="none" stroke="#3ec7a8" stroke-opacity="0.28" stroke-width="1.5"/>
  <!-- box: top lid seam -->
  <path d="M44 58 L80 42 L116 58 L80 74 Z" fill="url(#teal)" fill-opacity="0.25" stroke="url(#teal)" stroke-width="3" stroke-linejoin="round"/>
  <!-- box: left + right faces -->
  <path d="M44 58 L80 74 L80 118 L44 102 Z" fill="url(#teal)" fill-opacity="0.14" stroke="url(#teal)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M116 58 L80 74 L80 118 L116 102 Z" fill="url(#teal)" fill-opacity="0.08" stroke="url(#teal)" stroke-width="3" stroke-linejoin="round"/>
  <!-- approval gate: copper keyhole/shackle on the front seam -->
  <path d="M70 88 v-8 a10 10 0 0 1 20 0 v8" fill="none" stroke="#e0932a" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="66" y="88" width="28" height="22" rx="5" fill="#e0932a"/>
  <circle cx="80" cy="98" r="3.4" fill="#0a2529"/>
  <rect x="78.6" y="99" width="2.8" height="7" rx="1.4" fill="#0a2529"/>
</svg>
